{% extends "base.html" %}

{% block content %}

<section class="register">

    <h2>Create Your Acadivue AI Account</h2>
    {% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Full Name</label><br>
        <input type="text" name="full_name" placeholder="Enter your full name"><br><br>

        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>

        <label>Password</label><br>
        <input type="password" name="password" placeholder="Create a password"><br><br>

        <label>Confirm Password</label><br>
        <input type="password" name="confirm_password" placeholder="Confirm your password"><br><br>

        <button type="submit">Register</button>

    </form>

</section>

{% endblock %}
